- id: M03
  tier: ambiguous
  question: Which team is the best?
  accepted_sql:
    - >
      SELECT abbr, wins FROM (SELECT t.abbr, sum(w) AS wins FROM (
        SELECT home_team_id AS tid, home_pts > away_pts AS w FROM games
        UNION ALL SELECT away_team_id, away_pts > home_pts FROM games) x
        JOIN teams t ON t.team_id = x.tid GROUP BY t.abbr) ORDER BY wins DESC LIMIT 1
    - >
      SELECT abbr, margin FROM (SELECT t.abbr, sum(d) AS margin FROM (
        SELECT home_team_id AS tid, home_pts - away_pts AS d FROM games
        UNION ALL SELECT away_team_id, away_pts - home_pts FROM games) x
        JOIN teams t ON t.team_id = x.tid GROUP BY t.abbr) ORDER BY margin DESC LIMIT 1
  must_mention: [wins, record, margin, differential, metric]
- id: M04
  tier: ambiguous
  question: Who is the most efficient scorer?
  accepted_sql:
    - >
      SELECT player_id, p.first_name || ' ' || p.family_name AS player,
             round(sum(points) * 1.0 / (2 * (sum(fga) + 0.44 * sum(fta))), 3) AS ts
      FROM player_game_stats JOIN players p USING (player_id)
      GROUP BY player_id HAVING sum(fga) >= 500 ORDER BY ts DESC LIMIT 1
    - >
      SELECT player_id, p.first_name || ' ' || p.family_name AS player,
             round(sum(points) * 1.0 / sum(fga), 3) AS pts_per_fga
      FROM player_game_stats JOIN players p USING (player_id)
      GROUP BY player_id HAVING sum(fga) >= 500 ORDER BY pts_per_fga DESC LIMIT 1
  must_mention: [true shooting, ts, efficiency, per attempt, per shot, minimum, attempts]
