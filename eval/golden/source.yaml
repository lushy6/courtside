# Courtside golden set: 120 hand-written questions over data/courtside_nba.db.
#
# Written BEFORE any model saw them. `scripts/freeze_golden.py` executes every gold query and stores
# the results in dev.jsonl / test.jsonl (60% test, locked by LOCK.json). Do not tune prompts against
# the test split. See src/courtside/golden.py for how each kind is scored.
#
# Tiers (target / actual): lookup 20, aggregate 25, join 25, trap 20, ambiguous 10,
# unanswerable 10, adversarial 10.

# ============================================================ LOOKUP (20)
- id: L01
  tier: lookup
  question: How many points did Jayson Tatum score this season?
  gold_sql: >
    SELECT sum(points) AS points FROM player_game_stats
    WHERE player_id = (SELECT player_id FROM players WHERE first_name = 'Jayson' AND family_name = 'Tatum')
- id: L02
  tier: lookup
  question: What was the final score of the Knicks game on Christmas Day 2025?
  gold_sql: >
    SELECT home_abbr, away_abbr, home_pts, away_pts FROM games
    WHERE game_date = '2025-12-25' AND (home_abbr = 'NYK' OR away_abbr = 'NYK')
- id: L03
  tier: lookup
  question: What is Nikola Jokić's offensive RAPM?
  gold_sql: >
    SELECT o_rapm FROM player_rapm
    WHERE player_id = (SELECT player_id FROM players WHERE first_name = 'Nikola' AND family_name = 'Jokić')
- id: L04
  tier: lookup
  question: What position is Victor Wembanyama listed at?
  gold_sql: >
    SELECT position FROM player_positions
    WHERE player_id = (SELECT player_id FROM players WHERE first_name = 'Victor' AND family_name = 'Wembanyama')
- id: L05
  tier: lookup
  question: What is Stephen Curry's salary for 2026-27?
  gold_sql: >
    SELECT salary FROM contracts
    WHERE player_id = (SELECT player_id FROM players WHERE first_name = 'Stephen' AND family_name = 'Curry')
- id: L06
  tier: lookup
  question: How many games did Jaylen Brown play in?
  gold_sql: >
    SELECT count(minutes) AS games_played FROM player_game_stats
    WHERE player_id = (SELECT player_id FROM players WHERE first_name = 'Jaylen' AND family_name = 'Brown')
  notes: Games played means minutes IS NOT NULL (count(minutes) ignores the DNP rows).
- id: L07
  tier: lookup
  question: What is the salary cap for the 2026-27 season?
  gold_sql: SELECT salary_cap FROM cap_rules WHERE season = '2026-27'
- id: L08
  tier: lookup
  question: Who scored the most points in a single game this season, and how many?
  gold_sql: >
    SELECT p.first_name || ' ' || p.family_name AS player, g.points
    FROM player_game_stats g JOIN players p USING (player_id)
    ORDER BY g.points DESC LIMIT 1
- id: L09
  tier: lookup
  question: How many games were played on 2026-01-15?
  gold_sql: SELECT count(*) AS games FROM games WHERE game_date = '2026-01-15'
- id: L10
  tier: lookup
  question: How many players are listed at the center position (exactly C)?
  gold_sql: SELECT count(*) AS centers FROM player_positions WHERE position = 'C'
- id: L11
  tier: lookup
  question: What was the date of the first game of the season?
  gold_sql: SELECT min(game_date) AS first_game FROM games
- id: L12
  tier: lookup
  question: How many players have a player option on their 2026-27 contract?
  gold_sql: SELECT count(DISTINCT player_id) AS players FROM contracts WHERE "option" = 'player'
- id: L13
  tier: lookup
  question: What is the highest number of possessions played by any single Celtics lineup?
  gold_sql: SELECT max(poss) AS poss FROM lineup_stats WHERE team = 'BOS'
- id: L14
  tier: lookup
  question: What league-average lineup net rating does the shrinkage model use as its prior mean?
  gold_sql: SELECT mu FROM noise_model
- id: L15
  tier: lookup
  question: How many total points did the Spurs score in their home games?
  gold_sql: SELECT sum(home_pts) AS points FROM games WHERE home_abbr = 'SAS'
- id: L16
  tier: lookup
  question: How many three-pointers did Stephen Curry make this season?
  gold_sql: >
    SELECT sum(fg3m) AS threes FROM player_game_stats
    WHERE player_id = (SELECT player_id FROM players WHERE first_name = 'Stephen' AND family_name = 'Curry')
- id: L17
  tier: lookup
  question: What was the largest margin of victory in any game, and which teams played?
  gold_sql: >
    SELECT home_abbr, away_abbr, abs(home_pts - away_pts) AS margin FROM games
