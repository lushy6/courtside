# ============================================================ TRAP (20)
# Each trap has a naive query that returns a confident wrong answer. `accepted` are the defensible
# answers; `forbidden` is the naive one. See rules rank_lineups_honestly and
# games_played_means_minutes_not_null in semantic/nba.yaml.
- id: T01
  tier: trap
  question: What is the best five-man lineup in the league by net rating?
  notes: The raw top is a one-possession lineup rated +600.
  accepted_sql:
    - SELECT lineup_uid, players, poss, net_rating, shrunk FROM lineup_stats ORDER BY shrunk DESC LIMIT 1
    - SELECT lineup_uid, players, poss, net_rating, shrunk FROM lineup_stats WHERE poss >= 100 ORDER BY net_rating DESC LIMIT 1
  forbidden_sql:
    - SELECT lineup_uid, players, poss, net_rating, shrunk FROM lineup_stats ORDER BY net_rating DESC LIMIT 1
  must_mention: [poss, sample, shrunk, noise, reliab]
