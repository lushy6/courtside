# ============================================================ JOIN (25)
- id: J01
  tier: join
  question: What is the highest 2026-27 salary on the team with the most wins this season?
  gold_sql: >
    WITH wins AS (
      SELECT tid, sum(w) AS wins FROM (
        SELECT home_team_id AS tid, home_pts > away_pts AS w FROM games
        UNION ALL SELECT away_team_id, away_pts > home_pts FROM games) GROUP BY tid),
    best AS (SELECT tid FROM wins ORDER BY wins DESC LIMIT 1)
    SELECT max(c.salary) AS salary FROM contracts c
    WHERE c.team_id = (SELECT tid FROM best)
  notes: >
    Contracts are 2026-27, wins are 2025-26. Asks for the salary, not the player, because two
    Thunder players are tied at the top salary.
- id: J02
  tier: join
  question: Which three teams have the highest total 2026-27 payroll?
  order_matters: true
  gold_sql: >
    SELECT t.abbr, sum(c.salary) AS payroll FROM contracts c JOIN teams t USING (team_id)
    GROUP BY t.abbr ORDER BY payroll DESC LIMIT 3
- id: J03
  tier: join
  question: How many teams have a 2026-27 payroll above the luxury tax line?
  gold_sql: >
    SELECT count(*) AS teams FROM (SELECT team_id, sum(salary) AS payroll FROM contracts GROUP BY team_id)
    WHERE payroll > (SELECT tax_level FROM cap_rules WHERE season = '2026-27')
- id: J04
  tier: join
  question: Who has the highest RAPM among players earning at least $30 million in 2026-27?
  gold_sql: >
    SELECT r.name, r.rapm FROM player_rapm r
    JOIN (SELECT DISTINCT player_id FROM contracts WHERE salary >= 30000000) c USING (player_id)
    ORDER BY r.rapm DESC LIMIT 1
- id: J05
  tier: join
  question: What is the average 2026-27 salary by listed position?
  gold_sql: >
    SELECT pos.position, round(avg(s.salary)) AS avg_salary
    FROM (SELECT player_id, max(salary) AS salary FROM contracts GROUP BY player_id) s
    JOIN player_positions pos USING (player_id) GROUP BY pos.position
- id: J06
